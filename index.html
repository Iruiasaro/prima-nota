<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#0d1f33;padding:20px;color:#e8f0f7}
.card{background:#1e3a5f;border-radius:12px;padding:28px;max-width:900px;margin:0 auto;border:0.5px solid #2d5986}
h2{font-size:1.3rem;color:#e8f0f7;margin-bottom:4px}
.sub{color:#94afc8;font-size:.88rem;margin-bottom:20px}
label{display:block;font-size:.75rem;font-weight:600;color:#94afc8;margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
input[type=date],input[type=text]{width:100%;padding:9px 11px;border:1px solid #2d5986;border-radius:8px;font-size:.93rem;outline:none;color:#e8f0f7;margin-bottom:14px;background:#0d1f33}
input:focus{border-color:#4a7fa5}
.pbs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}
.pb{padding:7px 14px;border:1px solid #2d5986;background:#0d1f33;border-radius:7px;cursor:pointer;font-size:.82rem;font-weight:500;color:#94afc8}
.pb:hover,.pb.active{border-color:#4a7fa5;background:#2d5986;color:#e8f0f7}
.dr{display:flex;gap:10px}
.dr>div{flex:1}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.stat{flex:1;min-width:90px;text-align:center;background:#0d1f33;border-radius:9px;padding:10px 6px;border:1px solid #2d5986}
.sv{font-size:.88rem;font-weight:700;color:#e8f0f7}.sl{font-size:.65rem;color:#94afc8;margin-top:3px;text-transform:uppercase}
.red{color:#fc8181}.green{color:#68d391}.blue{color:#63b3ed}.orange{color:#f6ad55}
.preview{display:none;margin-bottom:14px}
.preview.show{display:block}
.ptitle{font-size:.75rem;font-weight:600;color:#94afc8;text-transform:uppercase;margin-bottom:8px}
.view-toggle{display:flex;gap:8px;margin-bottom:12px}
.vt{padding:6px 14px;border:1px solid #2d5986;background:#0d1f33;border-radius:7px;cursor:pointer;font-size:.78rem;font-weight:500;color:#94afc8}
.vt.active{background:#2d5986;color:#e8f0f7;border-color:#4a7fa5}
.tw{overflow-x:auto;border-radius:8px;border:1px solid #2d5986}
table{width:100%;border-collapse:collapse;font-size:.8rem}
thead th{background:#0d1f33;color:#94afc8;padding:8px 10px;text-align:left;font-size:.72rem;white-space:nowrap;border-bottom:1px solid #2d5986}
tbody td{padding:7px 12px;border-bottom:1px solid #2d5986;color:#e8f0f7;background:#1e3a5f}
tbody tr:hover td{background:#2d5986}
.dgr td{background:#0d1f33;font-weight:700;font-size:.75rem;padding:5px 10px;color:#94afc8}
.str td{background:#162d47;font-weight:600;font-size:.75rem;border-top:1px solid #2d5986;color:#94afc8}
.ttr td{background:#0d1f33;color:#e8f0f7;font-weight:700;padding:8px 10px;border-top:1px solid #2d5986}
.ttot td{background:#0a1929;color:#68d391;font-weight:700;padding:10px;border-top:2px solid #2d5986;font-size:.85rem}
.badge{display:inline-block;padding:1px 7px;border-radius:9px;font-size:.7rem;font-weight:600}
.bA{background:#742a2a;color:#fc8181}.bV{background:#1c4532;color:#68d391}.bC{background:#1a365d;color:#63b3ed}
.num{text-align:right;font-family:monospace}
.b1{width:100%;padding:10px;background:#0d1f33;color:#94afc8;border:1px solid #2d5986;border-radius:9px;font-size:.93rem;font-weight:600;cursor:pointer;margin-bottom:8px}
.b1:hover{background:#2d5986;color:#e8f0f7}
.btn-row{display:flex;gap:10px;margin-bottom:0}
.b2{flex:1;padding:13px;background:linear-gradient(135deg,#2d5986,#4a7fa5);color:white;border:none;border-radius:9px;font-size:.95rem;font-weight:600;cursor:pointer}
.b2:hover{opacity:.9}.b2:disabled{opacity:.5;cursor:not-allowed}
.b2.completo{background:linear-gradient(135deg,#276749,#38a169)}
.msg{text-align:center;padding:11px;border-radius:8px;font-size:.88rem;margin-top:10px;display:none}
.msg.L{display:block;background:#1a365d;color:#63b3ed}
.msg.E{display:block;background:#742a2a;color:#fc8181}
.msg.S{display:block;background:#1c4532;color:#68d391}
.sp{display:inline-block;width:13px;height:13px;border:2px solid #ffffff50;border-top-color:currentColor;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:4px}
@keyframes spin{to{transform:rotate(360deg)}}
.em{text-align:center;padding:26px;color:#4a7fa5}
</style>
</head>
<body>
<div class="card">
  <h2>&#128203; Genera Prima Nota</h2>
  <p class="sub">Seleziona il periodo e scarica il PDF &mdash; Urzetti Consulting</p>
  <div class="pbs">
    <button class="pb" onclick="sp('today',this)">Oggi</button>
    <button class="pb" onclick="sp('week',this)">Questa settimana</button>
    <button class="pb" onclick="sp('month',this)">Questo mese</button>
    <button class="pb" onclick="sp('lastmonth',this)">Mese scorso</button>
    <button class="pb" onclick="sp('year',this)">Quest'anno</button>
    <button class="pb" onclick="sp('x',this)">Personalizzato</button>
  </div>
  <div class="dr">
    <div><label>Data inizio</label><input type="date" id="df"></div>
    <div><label>Data fine</label><input type="date" id="dt"></div>
  </div>
  <div class="stats" id="stats" style="display:none">
    <div class="stat"><div class="sv" id="s1">-</div><div class="sl">Movimenti</div></div>
    <div class="stat"><div class="sv red" id="s2">-</div><div class="sl">Totale Dare</div></div>
    <div class="stat"><div class="sv orange" id="s6">-</div><div class="sl">IVA Debito</div></div>
    <div class="stat"><div class="sv green" id="s3">-</div><div class="sl">Totale Avere</div></div>
    <div class="stat"><div class="sv blue" id="s4">-</div><div class="sl">IVA Credito</div></div>
    <div class="stat"><div class="sv" id="s5">-</div><div class="sl">Saldo Ivato</div></div>
  </div>
  <div class="preview" id="prev">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
      <div class="ptitle">Anteprima movimenti</div>
      <div class="view-toggle">
        <button class="vt active" id="vt-semplice" onclick="setView('semplice',this)">Semplificata</button>
        <button class="vt" id="vt-completa" onclick="setView('completa',this)">Completa</button>
      </div>
    </div>
    <div class="tw" id="tw"></div>
  </div>
  <button class="b1" onclick="ant()">&#128269; Carica anteprima</button>
  <div class="btn-row">
    <button class="b2" id="bg-sempl" onclick="gen('semplice')">&#128196; PDF Semplificato</button>
    <button class="b2 completo" id="bg-compl" onclick="gen('completo')">&#128196; PDF Completo</button>
  </div>
  <div class="msg" id="msg"></div>
</div>
<script>
var C={
  pk:'PWpTAPVUFyyRzhz4emsP',
  tp_sempl:'cc4357fd-f64b-4f6d-91ec-b44ce7b80349',
  tp_compl:'e9574598-e7cc-4e11-88f8-bac934398b22'
};
var ef=function(v){return v===0?'':v.toLocaleString('it-IT',{minimumFractionDigits:2,maximumFractionDigits:2});};
var fmt=function(d){return d.toISOString().split('T')[0];};
var fmtData=function(d){if(!d)return'';var p=d.split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:d;};
var vistaAttuale='semplice';
window.ultimiRecs=[];

function setView(v,btn){
  vistaAttuale=v;
  document.querySelectorAll('.vt').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  if(ultimiRecs.length) rend(ultimiRecs);
}

function sp(p,btn){
  document.querySelectorAll('.pb').forEach(function(b){b.classList.remove('active');});btn.classList.add('active');
  var now=new Date();
  var y=now.getFullYear(),m=now.getMonth()+1,d=now.getDate();
  var offset=now.getTimezoneOffset();
  if(offset<0){var fixed=new Date(now.getTime()-offset*60000);y=fixed.getFullYear();m=fixed.getMonth()+1;d=fixed.getDate();}
  var pad=function(n){return n<10?'0'+n:String(n);};
  var f,to;
  to=y+'-'+pad(m)+'-'+pad(d);
  if(p==='today'){f=to;}
  else if(p==='week'){var wd=now.getDay()===0?6:now.getDay()-1;var mon=new Date(now);mon.setDate(d-wd);f=mon.getFullYear()+'-'+pad(mon.getMonth()+1)+'-'+pad(mon.getDate());}
  else if(p==='month'){f=y+'-'+pad(m)+'-01';}
  else if(p==='lastmonth'){var lm=m===1?12:m-1;var ly=m===1?y-1:y;var lastDay=new Date(y,m-1,0).getDate();f=ly+'-'+pad(lm)+'-01';to=ly+'-'+pad(lm)+'-'+pad(lastDay);}
  else if(p==='year'){f=y+'-01-01';}
  else return;
  document.getElementById('df').value=f;
  document.getElementById('dt').value=to;
}

async function fr(f,to){
  var r=await fetch('https://prima-nota-api.iruiasan123.workers.dev/?from='+f+'&to='+to);
  if(!r.ok){var e=await r.json().catch(function(){return{};});throw new Error(e.error||('Errore '+r.status));}
  var all=await r.json();
  return all.map(function(r){return{
    data:r.fields['Data']||'',
    desc:r.fields['Descrizione']||'',
    tipo:r.fields['Tipo']||'',
    dare:parseFloat(r.fields['DARE']||0),
    avere:parseFloat(r.fields['AVERE']||0),
   ivaDebito:parseFloat(r.fields['IVA_DEBITO']||0),
   ivaCredito:parseFloat(r.fields['IVA_CREDITO']||0),
    righe:r.fields['_righe']||[],
    isDare:r.fields['_isDare']||false
  };});
}

function bc(t){return t==='Acquisto'?'bA':t==='Vendita'?'bV':'bC';}
function rendSemplice(recs,bd){
  var h='<table><thead><tr><th>Data</th><th>Tipo</th><th style="text-align:right">Dare</th><th style="text-align:right">IVA Credito</th><th style="text-align:right">Avere</th><th style="text-align:right">IVA Debito</th></tr></thead><tbody>';
  Object.keys(bd).sort().forEach(function(dt){
    var rows=bd[dt];
    var byTipo={};
    rows.forEach(function(r){
      if(!byTipo[r.tipo]) byTipo[r.tipo]={dare:0,avere:0,ivaD:0,ivaC:0};
      byTipo[r.tipo].dare+=r.dare;
      byTipo[r.tipo].avere+=r.avere;
      byTipo[r.tipo].ivaD+=r.ivaDebito;
      byTipo[r.tipo].ivaC+=r.ivaCredito;
    });
    var dD=0,dA=0,dID=0,dIC=0;
    rows.forEach(function(r){dD+=r.dare;dA+=r.avere;dID+=r.ivaDebito;dIC+=r.ivaCredito;});
    h+='<tr class="dgr"><td colspan="6">\uD83D\uDCC5 '+fmtData(dt)+'</td></tr>';
    Object.keys(byTipo).forEach(function(tipo){
      var t=byTipo[tipo];
      h+='<tr><td>'+fmtData(dt)+'</td><td><span class="badge '+bc(tipo)+'">'+tipo+'</span></td><td class="num">'+(t.dare?ef(t.dare):'')+'</td><td class="num" style="color:#63b3ed">'+(t.ivaC?ef(t.ivaC):'')+'</td><td class="num">'+(t.avere?ef(t.avere):'')+'</td><td class="num" style="color:#f6ad55">'+(t.ivaD?ef(t.ivaD):'')+'</td></tr>';
    });
    h+='<tr class="str"><td colspan="2" style="text-align:right;padding-right:8px">Subtotale '+fmtData(dt)+'</td><td class="num">'+(dD?ef(dD):'')+'</td><td class="num">'+(dIC?ef(dIC):'')+'</td><td class="num">'+(dA?ef(dA):'')+'</td><td class="num">'+(dID?ef(dID):'')+'</td></tr>';
  });
  return h;
}

function rendCompleta(recs,bd){
  var h='<table><thead><tr><th>Data</th><th>Tipo</th><th>Aliquota</th><th style="text-align:right">Dare</th><th style="text-align:right">IVA Debito</th><th style="text-align:right">Avere</th><th style="text-align:right">IVA Credito</th></tr></thead><tbody>';
  Object.keys(bd).sort().forEach(function(dt){
    var rows=bd[dt],dD=0,dA=0,dID=0,dIC=0;
    rows.forEach(function(r){dD+=r.dare;dA+=r.avere;dID+=r.ivaDebito;dIC+=r.ivaCredito;});
    h+='<tr class="dgr"><td colspan="7">\uD83D\uDCC5 '+fmtData(dt)+'</td></tr>';
    rows.forEach(function(r){
      if(r.righe&&r.righe.length>0){
        r.righe.forEach(function(riga){
          var dare=r.isDare?riga.imponibile:0;
          var avere=r.isDare?0:riga.imponibile;
          var ivaD=r.isDare?riga.iva:0;
          var ivaC=r.isDare?0:riga.iva;
          h+='<tr><td>'+fmtData(r.data)+'</td><td><span class="badge '+bc(r.tipo)+'">'+r.tipo+'</span></td><td style="color:#94afc8;font-size:.75rem;">'+(riga.aliquota||'-')+'</td><td class="num">'+(dare?ef(dare):'')+'</td><td class="num" style="color:#f6ad55">'+(ivaD?ef(ivaD):'')+'</td><td class="num">'+(avere?ef(avere):'')+'</td><td class="num" style="color:#63b3ed">'+(ivaC?ef(ivaC):'')+'</td></tr>';
        });
      } else {
        h+='<tr><td>'+fmtData(r.data)+'</td><td><span class="badge '+bc(r.tipo)+'">'+r.tipo+'</span></td><td>-</td><td class="num">'+(r.dare?ef(r.dare):'')+'</td><td class="num">'+(r.ivaDebito?ef(r.ivaDebito):'')+'</td><td class="num">'+(r.avere?ef(r.avere):'')+'</td><td class="num">'+(r.ivaCredito?ef(r.ivaCredito):'')+'</td></tr>';
      }
    });
    h+='<tr class="str"><td colspan="3" style="text-align:right;padding-right:8px">Subtotale '+fmtData(dt)+'</td><td class="num">'+(dD?ef(dD):'')+'</td><td class="num">'+(dID?ef(dID):'')+'</td><td class="num">'+(dA?ef(dA):'')+'</td><td class="num">'+(dIC?ef(dIC):'')+'</td></tr>';
  });
  return h;
}

function rend(recs){
  ultimiRecs=recs;
  var pv=document.getElementById('prev'),st=document.getElementById('stats');
  if(!recs.length){pv.classList.add('show');document.getElementById('tw').innerHTML='<div class="em">Nessun movimento nel periodo.</div>';st.style.display='none';return;}
  var tD=0,tA=0,tID=0,tIC=0;
  recs.forEach(function(r){tD+=r.dare;tA+=r.avere;tID+=r.ivaDebito;tIC+=r.ivaCredito;});
  var saldoIvato=(tA+tIC)-(tD+tID);
  st.style.display='flex';
  document.getElementById('s1').textContent=recs.length;
  document.getElementById('s2').textContent='\u20AC '+ef(tD);
  document.getElementById('s6').textContent='\u20AC '+ef(tID);
  document.getElementById('s3').textContent='\u20AC '+ef(tA);
  document.getElementById('s4').textContent='\u20AC '+ef(tIC);
  var se=document.getElementById('s5');
  se.textContent=(saldoIvato>=0?'+':'')+'\u20AC '+ef(saldoIvato);
  se.className='sv '+(saldoIvato>=0?'green':'red');
  var bd={};recs.forEach(function(r){if(!bd[r.data])bd[r.data]=[];bd[r.data].push(r);});
  var h=vistaAttuale==='semplice'?rendSemplice(recs,bd):rendCompleta(recs,bd);
  var cols=vistaAttuale==='semplice'?2:3;
  h+='</tbody><tfoot>';
  h+='<tr class="ttr"><td colspan="'+cols+'">TOTALI IMPONIBILI</td><td class="num">'+ef(tD)+'</td><td class="num" style="color:#f6ad55">'+ef(tID)+'</td><td class="num">'+ef(tA)+'</td><td class="num" style="color:#63b3ed">'+ef(tIC)+'</td></tr>';
  h+='<tr class="ttot"><td colspan="'+cols+'">TOTALE IVATO</td><td class="num">\u20AC '+ef(tD+tID)+'</td><td></td><td class="num">\u20AC '+ef(tA+tIC)+'</td><td></td></tr>';
  h+='</tfoot></table>';
  pv.classList.add('show');document.getElementById('tw').innerHTML=h;
}

async function ant(){
  var f=document.getElementById('df').value,to=document.getElementById('dt').value;
  if(!f||!to){sm('E','Seleziona prima il periodo.');return;}
  sm('L','<span class="sp"></span> Caricamento da Airtable...');
  try{var r=await fr(f,to);hm();rend(r);}catch(e){sm('E','Errore: '+e.message);}
}

window.buildPayloadCompleto=function(recs,f,to){
  var tD=0,tA=0,tID=0,tIC=0;
  recs.forEach(function(r){tD+=r.dare;tA+=r.avere;tID+=r.ivaDebito;tIC+=r.ivaCredito;});
  var saldoIvato=(tA+tIC)-(tD+tID);
  var bd={};
  recs.forEach(function(r){if(!bd[r.data])bd[r.data]=[];bd[r.data].push(r);});
  var righe=[];
  Object.keys(bd).sort().forEach(function(dt){
    var byTipo={};
    bd[dt].forEach(function(r){
      if(!byTipo[r.tipo]) byTipo[r.tipo]={dare:0,avere:0,ivaD:0,ivaC:0};
      byTipo[r.tipo].dare+=r.dare;
      byTipo[r.tipo].avere+=r.avere;
      byTipo[r.tipo].ivaD+=r.ivaDebito;
      byTipo[r.tipo].ivaC+=r.ivaCredito;
    });
    Object.keys(byTipo).forEach(function(tipo){
      var t=byTipo[tipo];
      righe.push({fields:{
        'Data':fmtData(dt),
        'Tipo':tipo,
        'DARE':t.dare?ef(t.dare):'',
        'IVA Debito':t.ivaD?ef(t.ivaD):'',
        'AVERE':t.avere?ef(t.avere):'',
        'IVA Credito':t.ivaC?ef(t.ivaC):''
      }});
    });
  });
  return {cliente:'Urzetti Consulting',periodo:f===to?'Giorno '+fmtData(f):'Dal '+fmtData(f)+' al '+fmtData(to),data_generazione:new Date().toLocaleDateString('it-IT'),righe:righe,totale_dare:ef(tD),totale_iva_debito:ef(tID),totale_avere:ef(tA),totale_iva_credito:ef(tIC),totale_ivato_dare:ef(tD+tID),totale_ivato_avere:ef(tA+tIC),saldo:(saldoIvato>=0?'+':'')+ef(saldoIvato)+'\u20AC'};
}

function buildPayloadCompleto(recs,f,to){
  var tD=0,tA=0,tID=0,tIC=0;
  recs.forEach(function(r){tD+=r.dare;tA+=r.avere;tID+=r.ivaDebito;tIC+=r.ivaCredito;});
  var saldoIvato=(tA+tIC)-(tD+tID);
  var bd={};
  recs.forEach(function(r){if(!bd[r.data])bd[r.data]=[];bd[r.data].push(r);});
  var righe=[];
  Object.keys(bd).sort().forEach(function(dt){
    bd[dt].forEach(function(r){
      if(r.righe&&r.righe.length>0){
        r.righe.forEach(function(riga){
          var dare=r.isDare?riga.imponibile:0;
          var avere=r.isDare?0:riga.imponibile;
          var ivaD=r.isDare?riga.iva:0;
          var ivaC=r.isDare?0:riga.iva;
          righe.push({fields:{
            'Data':fmtData(dt),
            'Tipo':r.tipo,
            'Aliquota':riga.aliquota||'-',
            'DARE':dare?ef(dare):'',
            'IVA Debito':ivaD?ef(ivaD):'',
            'AVERE':avere?ef(avere):'',
            'IVA Credito':ivaC?ef(ivaC):''
          }});
        });
      } else {
        righe.push({fields:{
          'Data':fmtData(dt),
          'Tipo':r.tipo,
          'Aliquota':'-',
          'DARE':r.dare?ef(r.dare):'',
          'IVA Debito':r.ivaDebito?ef(r.ivaDebito):'',
          'AVERE':r.avere?ef(r.avere):'',
          'IVA Credito':r.ivaCredito?ef(r.ivaCredito):''
        }});
      }
    });
  });
  return {cliente:'Urzetti Consulting',periodo:f===to?'Giorno '+fmtData(f):'Dal '+fmtData(f)+' al '+fmtData(to),data_generazione:new Date().toLocaleDateString('it-IT'),righe:righe,totale_dare:ef(tD),totale_iva_debito:ef(tID),totale_avere:ef(tA),totale_iva_credito:ef(tIC),totale_ivato_dare:ef(tD+tID),totale_ivato_avere:ef(tA+tIC),saldo:(saldoIvato>=0?'+':'')+ef(saldoIvato)+'\u20AC'};
}

async function gen(tipo){
  var f=document.getElementById('df').value,to=document.getElementById('dt').value;
  if(!f||!to){sm('E','Seleziona prima il periodo.');return;}
  var btnId=tipo==='semplice'?'bg-sempl':'bg-compl';
  var btn=document.getElementById(btnId);
  btn.disabled=true;btn.textContent='Generazione in corso...';
  sm('L','<span class="sp"></span> Recupero dati...');
  try{
    var recs=await fr(f,to);
    if(!recs.length){sm('E','Nessun movimento nel periodo.');btn.disabled=false;btn.textContent=tipo==='semplice'?'\uD83D\uDCC4 PDF Semplificato':'\uD83D\uDCC4 PDF Completo';return;}
    rend(recs);
    var payload=tipo==='semplice'?buildPayloadSemplice(recs,f,to):buildPayloadCompleto(recs,f,to);
    var templateId=tipo==='semplice'?C.tp_sempl:C.tp_compl;
    var pl={document:{document_template_id:templateId,status:'pending',payload:payload}};
    sm('L','<span class="sp"></span> Invio a PDFMonkey...');
    var cr=await fetch('https://api.pdfmonkey.io/api/v1/documents',{method:'POST',headers:{Authorization:'Bearer '+C.pk,'Content-Type':'application/json'},body:JSON.stringify(pl)});
    if(!cr.ok){var er=await cr.json().catch(function(){return{};});throw new Error((er.errors&&er.errors[0]&&er.errors[0].detail)||('PDFMonkey errore '+cr.status));}
    var cd=await cr.json(),id=cd.document.id,url=null;
    for(var i=0;i<30;i++){
      await new Promise(function(r){setTimeout(r,1000);});
      var pr=await fetch('https://api.pdfmonkey.io/api/v1/documents/'+id,{headers:{Authorization:'Bearer '+C.pk}});
      var pd=await pr.json(),st=pd.document.status;
      if(st==='success'){url=pd.document.download_url;break;}
      if(st==='error')throw new Error('PDFMonkey ha segnalato un errore.');
      sm('L','<span class="sp"></span> Generazione PDF... ('+(i+1)+'s)');
    }
    if(!url)throw new Error('Timeout generazione PDF. Riprova.');
    var nomeFile='primanota_'+tipo+'_'+fmtData(f).replace(/\//g,'-')+'_'+fmtData(to).replace(/\//g,'-')+'.pdf';
    var a=document.createElement('a');a.href=url;a.download=nomeFile;a.target='_blank';document.body.appendChild(a);a.click();document.body.removeChild(a);
    sm('S','\u2705 PDF '+tipo+' generato! Download avviato.');
  }catch(e){sm('E','Errore: '+e.message);}
  finally{btn.disabled=false;btn.innerHTML=tipo==='semplice'?'\uD83D\uDCC4 PDF Semplificato':'\uD83D\uDCC4 PDF Completo';}
}

function sm(t,m){var e=document.getElementById('msg');e.className='msg '+t;e.innerHTML=m;}
function hm(){document.getElementById('msg').className='msg';}
(function(){var t=new Date();document.getElementById('df').value=fmt(new Date(t.getFullYear(),t.getMonth(),1));document.getElementById('dt').value=fmt(t);})();
</script>
